version: '3.8'

services:
  backend:
    build: .
    container_name: sdoc_backend
    ports:
      - "8000:8000"
    # Pass all variables from .env straight into the running container
    env_file:
      - .env
    volumes:
      # Mount local inbox & attachments so updates reflect immediately
      - ./inbox:/app/inbox
      - ./attachments:/app/attachments
    restart: always